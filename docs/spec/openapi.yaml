openapi: 3.0.0
info:
  title: Azure AI Foundry Models Service
  license:
    name: MIT
    url: https://github.com/openai/openai-openapi/blob/master/LICENSE
  version: v1
tags:
- name: Batch
- name: Chat
- name: Completions
- name: Containers
- name: Conversations
- name: Evals
- name: Files
- name: Embeddings
- name: Fine-tuning
- name: Models
- name: Realtime
- name: Responses
- name: Threads
- name: Vector Stores
paths:
  /responses:
    post:
      operationId: createResponse
      description: Creates a model response.
      parameters:
      - name: api-version
        in: query
        required: false
        description: |-
          The explicit Azure AI Foundry Models API version to use for this request.
          `v1` if not otherwise specified.
        schema:
          $ref: '#/components/schemas/AzureAIFoundryModelsApiVersion'
          default: v1
      responses:
        '200':
          description: The request has succeeded.
          headers:
            apim-request-id:
              required: false
              description: A request ID used for troubleshooting purposes.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InlineResponse200'
            text/event-stream: {}
        default:
          description: An unexpected error response.
          headers:
            apim-request-id:
              required: false
              description: A request ID used for troubleshooting purposes.
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                    nullable: true
                  message:
                    type: string
                  param:
                    type: string
                    nullable: true
                  type:
                    type: string
                  inner_error: {}
                required:
                - code
                - message
      tags:
      - Responses
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OpenAICreateResponse'
      x-ms-examples:
        Create a response request:
          $ref: ./examples/responses.yaml
security:
- ApiKeyAuth: []
- OAuth2Auth:
  - https://cognitiveservices.azure.com/.default
components:
  schemas:
    AzureAIFoundryModelsApiVersion:
      type: string
      enum:
      - v1
      - preview
    AzureContentFilterBlocklistResult:
      type: object
      required:
      - filtered
      properties:
        filtered:
          type: boolean
          description: A value indicating whether any of the detailed blocklists resulted in a filtering action.
        details:
          type: array
          items:
            $ref: '#/components/schemas/AzureContentFilterBlocklistResultDetails'
          description: The pairs of individual blocklist IDs and whether they resulted in a filtering action.
      description: A collection of true/false filtering results for configured custom blocklists.
    AzureContentFilterCompletionTextSpan:
      type: object
      required:
      - completion_start_offset
      - completion_end_offset
      properties:
        completion_start_offset:
          type: integer
          format: int32
          description: Offset of the UTF32 code point which begins the span.
        completion_end_offset:
          type: integer
          format: int32
          description: Offset of the first UTF32 code point which is excluded from the span. This field is always equal to completion_start_offset for empty spans. This field is always larger than completion_start_offset for non-empty spans.
      description: A representation of a span of completion text as used by Azure OpenAI content filter results.
    AzureContentFilterCompletionTextSpanDetectionResult:
      type: object
      required:
      - filtered
      - detected
      - details
      properties:
        filtered:
          type: boolean
          description: Whether the content detection resulted in a content filtering action.
        detected:
          type: boolean
          description: Whether the labeled content category was detected in the content.
        details:
          type: array
          items:
            $ref: '#/components/schemas/AzureContentFilterCompletionTextSpan'
          description: Detailed information about the detected completion text spans.
    AzureContentFilterCustomTopicResult:
      type: object
      required:
      - filtered
      properties:
        filtered:
          type: boolean
          description: A value indicating whether any of the detailed topics resulted in a filtering action.
        details:
          type: array
          items:
            $ref: '#/components/schemas/AzureContentFilterCustomTopicResultDetails'
          description: The pairs of individual topic IDs and whether they are detected.
      description: A collection of true/false filtering results for configured custom topics.
    AzureContentFilterDetectionResult:
      type: object
      required:
      - filtered
      - detected
      properties:
        filtered:
          type: boolean
          description: Whether the content detection resulted in a content filtering action.
        detected:
          type: boolean
          description: Whether the labeled content category was detected in the content.
      description: |-
        A labeled content filter result item that indicates whether the content was detected and whether the content was
        filtered.
    AzureContentFilterForResponsesAPI:
      type: object
      required:
      - blocked
      - source_type
      - content_filter_results
      - content_filter_offsets
      properties:
        blocked:
          type: boolean
          description: Indicate if the response is blocked.
        source_type:
          type: string
          description: The name of the source type of the message.
        content_filter_results:
          allOf:
          - $ref: '#/components/schemas/AzureContentFilterResultsForResponsesAPI'
          description: A content filter result for a single response item produced by a generative AI system.
        content_filter_offsets:
          $ref: '#/components/schemas/AzureContentFilterResultOffsets'
        tool_call_id:
          type: string
          description: The ID of the tool call associated with this content filter result, if applicable.
    AzureContentFilterPersonallyIdentifiableInformationResult:
      type: object
      properties:
        redacted_text:
          type: string
          description: The redacted text with PII information removed or masked.
        sub_categories:
          type: array
          items:
            $ref: '#/components/schemas/AzurePiiSubCategoryResult'
          description: Detailed results for individual PIIHarmSubCategory(s).
      allOf:
      - $ref: '#/components/schemas/AzureContentFilterDetectionResult'
      description: A content filter detection result for Personally Identifiable Information that includes harm extensions.
    AzureContentFilterResultOffsets:
      type: object
      required:
      - start_offset
      - end_offset
      - check_offset
      properties:
        start_offset:
          type: integer
          format: int32
        end_offset:
          type: integer
          format: int32
        check_offset:
          type: integer
          format: int32
    AzureContentFilterResultsForResponsesAPI:
      type: object
      properties:
        sexual:
          allOf:
          - $ref: '#/components/schemas/AzureContentFilterSeverityResult'
          description: |-
            A content filter category for language related to anatomical organs and genitals, romantic relationships, acts
            portrayed in erotic or affectionate terms, pregnancy, physical sexual acts, including those portrayed as an
            assault or a forced sexual violent act against one's will, prostitution, pornography, and abuse.
        hate:
          allOf:
          - $ref: '#/components/schemas/AzureContentFilterSeverityResult'
          description: |-
            A content filter category that can refer to any content that attacks or uses pejorative or discriminatory
            language with reference to a person or identity group based on certain differentiating attributes of these groups
            including but not limited to race, ethnicity, nationality, gender identity and expression, sexual orientation,
            religion, immigration status, ability status, personal appearance, and body size.
        violence:
          allOf:
          - $ref: '#/components/schemas/AzureContentFilterSeverityResult'
          description: |-
            A content filter category for language related to physical actions intended to hurt, injure, damage, or kill
            someone or something; describes weapons, guns and related entities, such as manufactures, associations,
            legislation, and so on.
        self_harm:
          allOf:
          - $ref: '#/components/schemas/AzureContentFilterSeverityResult'
          description: |-
            A content filter category that describes language related to physical actions intended to purposely hurt, injure,
            damage one's body or kill oneself.
        profanity:
          allOf:
          - $ref: '#/components/schemas/AzureContentFilterDetectionResult'
          description: |-
            A detection result that identifies whether crude, vulgar, or otherwise objection language is present in the
            content.
        custom_blocklists:
          allOf:
          - $ref: '#/components/schemas/AzureContentFilterBlocklistResult'
          description: A collection of binary filtering outcomes for configured custom blocklists.
        custom_topics:
          allOf:
          - $ref: '#/components/schemas/AzureContentFilterCustomTopicResult'
          description: A collection of binary filtering outcomes for configured custom topics.
        error:
          $ref: '#/components/schemas/AzureContentFilterResultsForResponsesAPIError'
        jailbreak:
          allOf:
          - $ref: '#/components/schemas/AzureContentFilterDetectionResult'
          description: |-
            A detection result that describes user prompt injection attacks, where malicious users deliberately exploit
            system vulnerabilities to elicit unauthorized behavior from the LLM. This could lead to inappropriate content
            generation or violations of system-imposed restrictions.
        task_adherence:
          allOf:
          - $ref: '#/components/schemas/AzureContentFilterDetectionResult'
          description: A detection result that indicates if the execution flow still sticks the plan.
        protected_material_text:
          allOf:
          - $ref: '#/components/schemas/AzureContentFilterDetectionResult'
          description: A detection result that describes a match against text protected under copyright or other status.
        protected_material_code:
          $ref: '#/components/schemas/AzureContentFilterResultsForResponsesAPIProtectedMaterialCode'
        ungrounded_material:
          $ref: '#/components/schemas/AzureContentFilterCompletionTextSpanDetectionResult'
        personally_identifiable_information:
          allOf:
          - $ref: '#/components/schemas/AzureContentFilterPersonallyIdentifiableInformationResult'
          description: A detection result that describes matches against Personal Identifiable Information with configurable subcategories.
        indirect_attack:
          allOf:
          - $ref: '#/components/schemas/AzureContentFilterDetectionResult'
          description: |-
            A detection result that describes attacks on systems powered by Generative AI models that can happen every time
            an application processes information that wasn’t directly authored by either the developer of the application or
            the user.
    AzureContentFilterSeverityResult:
      type: object
      required:
      - filtered
      - severity
      properties:
        filtered:
          type: boolean
          description: Whether the content severity resulted in a content filtering action.
        severity:
          type: string
          enum:
          - safe
          - low
          - medium
          - high
          description: The labeled severity of the content.
      description: |-
        A labeled content filter result item that indicates whether the content was filtered and what the qualitative
        severity level of the content was, as evaluated against content filter configuration for the category.
    AzurePiiSubCategoryResult:
      type: object
      required:
      - sub_category
      - filtered
      - detected
      - redacted
      properties:
        sub_category:
          type: string
          description: The PIIHarmSubCategory that was evaluated.
        filtered:
          type: boolean
          description: Whether the content detection resulted in a content filtering action for this subcategory.
        detected:
          type: boolean
          description: Whether the labeled content subcategory was detected in the content.
        redacted:
          type: boolean
          description: Whether the content was redacted for this subcategory.
      description: Result details for individual PIIHarmSubCategory(s).
    OpenAIContextManagementParam:
      type: object
      required:
      - type
      properties:
        type:
          type: string
          description: The context management entry type. Currently only 'compaction' is supported.
        compact_threshold:
          type: integer
          nullable: true
    OpenAIConversationParam:
      oneOf:
      - type: string
      - $ref: '#/components/schemas/OpenAIConversationParam2'
      description: |-
        The conversation that this response belongs to. Items from this conversation are prepended to `input_items` for this response request.
        Input items and output items from this response are automatically added to this conversation after this response completes.
    OpenAIConversationParam2:
      type: object
      required:
      - id
      properties:
        id:
          type: string
          description: The unique ID of the conversation.
      description: The conversation that this response belongs to.
      title: Conversation object
    OpenAIConversationReference:
      type: object
      required:
      - id
      properties:
        id:
          type: string
          description: The unique ID of the conversation that this response was associated with.
      description: The conversation that this response belonged to. Input items and output items from this response were automatically added to this conversation.
      title: Conversation
    OpenAICreateResponse:
      type: object
      properties:
        metadata:
          $ref: '#/components/schemas/OpenAIMetadata'
          nullable: true
        top_logprobs:
          type: integer
          nullable: true
        temperature:
          default: 1
          type: number
          nullable: true
        top_p:
          default: 1
          type: number
          nullable: true
        user:
          type: string
          description: |-
            This field is being replaced by `safety_identifier` and `prompt_cache_key`. Use `prompt_cache_key` instead to maintain caching optimizations.
              A stable identifier for your end-users.
              Used to boost cache hit rates by better bucketing similar requests and  to help OpenAI detect and prevent abuse. [Learn more](/docs/guides/safety-best-practices#safety-identifiers).
          deprecated: true
        safety_identifier:
          type: string
          maxLength: 64
          description: |-
            A stable identifier used to help detect users of your application that may be violating OpenAI's usage policies.
              The IDs should be a string that uniquely identifies each user, with a maximum length of 64 characters. We recommend hashing their username or email address, in order to avoid sending us any identifying information. [Learn more](/docs/guides/safety-best-practices#safety-identifiers).
        prompt_cache_key:
          type: string
          description: Used by OpenAI to cache responses for similar requests to optimize your cache hit rates. Replaces the `user` field. [Learn more](/docs/guides/prompt-caching).
        prompt_cache_retention:
          type: string
          enum:
          - in_memory
          - 24h
          nullable: true
        previous_response_id:
          type: string
          nullable: true
        model:
          type: string
          description: |-
            Model ID used to generate the response, like `gpt-4o` or `o3`. OpenAI
              offers a wide range of models with different capabilities, performance
              characteristics, and price points. Refer to the [model guide](/docs/models)
              to browse and compare available models.
        reasoning:
          $ref: '#/components/schemas/OpenAIReasoning'
          nullable: true
        background:
          type: boolean
          nullable: true
        max_tool_calls:
          type: integer
          nullable: true
        text:
          $ref: '#/components/schemas/OpenAIResponseTextParam'
        tools:
          $ref: '#/components/schemas/OpenAIToolsArray'
          description: |-
            An array of tools the model may call while generating a response. You
            can specify which tool to use by setting the `tool_choice` parameter.

            The two categories of tools you can provide the model are:

            - **Built-in tools**: Tools that are provided by OpenAI that extend the
              model's capabilities, like file search.
            - **Function calls (custom tools)**: Functions that are defined by you,
              enabling the model to call your own code.
        tool_choice:
          oneOf:
          - $ref: '#/components/schemas/OpenAIToolChoiceOptions'
          - $ref: '#/components/schemas/OpenAIToolChoiceParam'
        prompt:
          $ref: '#/components/schemas/OpenAIPrompt'
        truncation:
          default: disabled
          type: string
          enum:
          - auto
          - disabled
          nullable: true
        input:
          $ref: '#/components/schemas/OpenAIInputParam'
        include:
          type: array
          items:
            $ref: '#/components/schemas/OpenAIIncludeEnum'
          nullable: true
        parallel_tool_calls:
          default: true
          type: boolean
          nullable: true
        store:
          default: true
          type: boolean
          nullable: true
        instructions:
          type: string
          nullable: true
        stream:
          type: boolean
          nullable: true
        stream_options:
          $ref: '#/components/schemas/OpenAIResponseStreamOptions'
          nullable: true
        conversation:
          $ref: '#/components/schemas/OpenAIConversationParam'
          nullable: true
        context_management:
          description: Context management configuration for this request.
          type: array
          items:
            $ref: '#/components/schemas/OpenAIContextManagementParam'
          nullable: true
        max_output_tokens:
          type: integer
          nullable: true
    OpenAIIncludeEnum:
      anyOf:
      - type: string
      - type: string
        enum:
        - file_search_call.results
        - web_search_call.results
        - web_search_call.action.sources
        - message.input_image.image_url
        - computer_call_output.output.image_url
        - code_interpreter_call.outputs
        - reasoning.encrypted_content
        - message.output_text.logprobs
      description: |-
        Specify additional output data to include in the model response. Currently supported values are:
        - `web_search_call.results`: Include the search results of the web search tool call.
        - `web_search_call.action.sources`: Include the sources of the web search tool call.
        - `code_interpreter_call.outputs`: Includes the outputs of python code execution in code interpreter tool call items.
        - `computer_call_output.output.image_url`: Include image urls from the computer call output.
        - `file_search_call.results`: Include the search results of the file search tool call.
        - `message.input_image.image_url`: Include image urls from the input message.
        - `message.output_text.logprobs`: Include logprobs with assistant messages.
        - `reasoning.encrypted_content`: Includes an encrypted version of reasoning tokens in reasoning item outputs. This enables reasoning items to be used in multi-turn conversations when using the Responses API statelessly (like when the `store` parameter is set to `false`, or when an organization is enrolled in the zero data retention program).
    OpenAIInputItem:
      type: object
      required:
      - type
      properties:
        type:
          $ref: '#/components/schemas/OpenAIInputItemType'
      discriminator:
        propertyName: type
        mapping:
          message: '#/components/schemas/OpenAI.EasyInputMessage'
          item_reference: '#/components/schemas/OpenAI.ItemReferenceParam'
          output_message: '#/components/schemas/OpenAI.InputItemOutputMessage'
          file_search_call: '#/components/schemas/OpenAI.InputItemFileSearchToolCall'
          computer_call: '#/components/schemas/OpenAI.InputItemComputerToolCall'
          computer_call_output: '#/components/schemas/OpenAI.InputItemComputerCallOutputItemParam'
          web_search_call: '#/components/schemas/OpenAI.InputItemWebSearchToolCall'
          function_call: '#/components/schemas/OpenAI.InputItemFunctionToolCall'
          function_call_output: '#/components/schemas/OpenAI.InputItemFunctionCallOutputItemParam'
          tool_search_call: '#/components/schemas/OpenAI.InputItemToolSearchCallItemParam'
          tool_search_output: '#/components/schemas/OpenAI.InputItemToolSearchOutputItemParam'
          reasoning: '#/components/schemas/OpenAI.InputItemReasoningItem'
          compaction: '#/components/schemas/OpenAI.InputItemCompactionSummaryItemParam'
          image_generation_call: '#/components/schemas/OpenAI.InputItemImageGenToolCall'
          code_interpreter_call: '#/components/schemas/OpenAI.InputItemCodeInterpreterToolCall'
          local_shell_call: '#/components/schemas/OpenAI.InputItemLocalShellToolCall'
          local_shell_call_output: '#/components/schemas/OpenAI.InputItemLocalShellToolCallOutput'
          shell_call: '#/components/schemas/OpenAI.InputItemFunctionShellCallItemParam'
          shell_call_output: '#/components/schemas/OpenAI.InputItemFunctionShellCallOutputItemParam'
          apply_patch_call: '#/components/schemas/OpenAI.InputItemApplyPatchToolCallItemParam'
          apply_patch_call_output: '#/components/schemas/OpenAI.InputItemApplyPatchToolCallOutputItemParam'
          mcp_list_tools: '#/components/schemas/OpenAI.InputItemMcpListTools'
          mcp_approval_request: '#/components/schemas/OpenAI.InputItemMcpApprovalRequest'
          mcp_approval_response: '#/components/schemas/OpenAI.InputItemMcpApprovalResponse'
          mcp_call: '#/components/schemas/OpenAI.InputItemMcpToolCall'
          custom_tool_call_output: '#/components/schemas/OpenAI.InputItemCustomToolCallOutput'
          custom_tool_call: '#/components/schemas/OpenAI.InputItemCustomToolCall'
          tool_approval_response: '#/components/schemas/AzureToolApprovalResponse'
      description: |-
        An item representing part of the context for the response to be
        generated by the model. Can contain text, images, and audio inputs,
        as well as previous assistant responses and tool call outputs.
    OpenAIInputItemType:
      anyOf:
      - type: string
      - type: string
        enum:
        - message
        - output_message
        - file_search_call
        - computer_call
        - computer_call_output
        - web_search_call
        - function_call
        - function_call_output
        - tool_search_call
        - tool_search_output
        - reasoning
        - compaction
        - image_generation_call
        - code_interpreter_call
        - local_shell_call
        - local_shell_call_output
        - shell_call
        - shell_call_output
        - apply_patch_call
        - apply_patch_call_output
        - mcp_list_tools
        - mcp_approval_request
        - mcp_approval_response
        - mcp_call
        - custom_tool_call_output
        - custom_tool_call
        - item_reference
        - tool_approval_response
    OpenAIInputParam:
      oneOf:
      - type: string
      - type: array
        items:
          $ref: '#/components/schemas/OpenAIInputItem'
      description: |-
        Text, image, or file inputs to the model, used to generate a response.
        Learn more:
        - [Text inputs and outputs](/docs/guides/text)
        - [Image inputs](/docs/guides/images)
        - [File inputs](/docs/guides/pdf-files)
        - [Conversation state](/docs/guides/conversation-state)
        - [Function calling](/docs/guides/function-calling)
    OpenAIMetadata:
      type: object
      description: |-
        Set of 16 key-value pairs that can be attached to an object. This can be
        useful for storing additional information about the object in a structured
        format, and querying for objects via API or the dashboard.
        Keys are strings with a maximum length of 64 characters. Values are strings
        with a maximum length of 512 characters.
      x-oaiTypeLabel: map
    OpenAIOutputItem:
      type: object
      required:
      - type
      properties:
        type:
          $ref: '#/components/schemas/OpenAIOutputItemType'
      discriminator:
        propertyName: type
        mapping:
          output_message: '#/components/schemas/OpenAI.OutputItemOutputMessage'
          file_search_call: '#/components/schemas/OpenAI.OutputItemFileSearchToolCall'
          function_call: '#/components/schemas/OpenAI.OutputItemFunctionToolCall'
          function_call_output: '#/components/schemas/OpenAI.OutputItemFunctionToolCallOutput'
          web_search_call: '#/components/schemas/OpenAI.OutputItemWebSearchToolCall'
          computer_call: '#/components/schemas/OpenAI.OutputItemComputerToolCall'
          computer_call_output: '#/components/schemas/OpenAI.OutputItemComputerToolCallOutput'
          reasoning: '#/components/schemas/OpenAI.OutputItemReasoningItem'
          tool_search_call: '#/components/schemas/OpenAI.OutputItemToolSearchCall'
          tool_search_output: '#/components/schemas/OpenAI.OutputItemToolSearchOutput'
          compaction: '#/components/schemas/OpenAI.OutputItemCompactionBody'
          image_generation_call: '#/components/schemas/OpenAI.OutputItemImageGenToolCall'
          code_interpreter_call: '#/components/schemas/OpenAI.OutputItemCodeInterpreterToolCall'
          local_shell_call: '#/components/schemas/OpenAI.OutputItemLocalShellToolCall'
          local_shell_call_output: '#/components/schemas/OpenAI.OutputItemLocalShellToolCallOutput'
          shell_call: '#/components/schemas/OpenAI.OutputItemFunctionShellCall'
          shell_call_output: '#/components/schemas/OpenAI.OutputItemFunctionShellCallOutput'
          apply_patch_call: '#/components/schemas/OpenAI.OutputItemApplyPatchToolCall'
          apply_patch_call_output: '#/components/schemas/OpenAI.OutputItemApplyPatchToolCallOutput'
          mcp_call: '#/components/schemas/OpenAI.OutputItemMcpToolCall'
          mcp_list_tools: '#/components/schemas/OpenAI.OutputItemMcpListTools'
          mcp_approval_request: '#/components/schemas/OpenAI.OutputItemMcpApprovalRequest'
          mcp_approval_response: '#/components/schemas/OpenAI.OutputItemMcpApprovalResponseResource'
          custom_tool_call: '#/components/schemas/OpenAI.OutputItemCustomToolCallResource'
          custom_tool_call_output: '#/components/schemas/OpenAI.OutputItemCustomToolCallOutputResource'
          tool_approval_request: '#/components/schemas/AzureToolApprovalRequest'
    OpenAIOutputItemType:
      anyOf:
      - type: string
      - type: string
        enum:
        - output_message
        - file_search_call
        - function_call
        - function_call_output
        - web_search_call
        - computer_call
        - computer_call_output
        - reasoning
        - tool_search_call
        - tool_search_output
        - compaction
        - image_generation_call
        - code_interpreter_call
        - local_shell_call
        - local_shell_call_output
        - shell_call
        - shell_call_output
        - apply_patch_call
        - apply_patch_call_output
        - mcp_call
        - mcp_list_tools
        - mcp_approval_request
        - mcp_approval_response
        - custom_tool_call
        - custom_tool_call_output
        - tool_approval_request
    OpenAIPrompt:
      type: object
      required:
      - id
      properties:
        id:
          type: string
          description: The unique identifier of the prompt template to use.
        version:
          type: string
          nullable: true
        variables:
          $ref: '#/components/schemas/OpenAIResponsePromptVariables'
          nullable: true
      description: |-
        Reference to a prompt template and its variables.
        [Learn more](/docs/guides/text?api-mode=responses#reusable-prompts).
    OpenAIReasoning:
      type: object
      properties:
        effort:
          $ref: '#/components/schemas/OpenAIReasoningEffort'
        summary:
          type: string
          enum:
          - auto
          - concise
          - detailed
          nullable: true
        generate_summary:
          type: string
          enum:
          - auto
          - concise
          - detailed
          nullable: true
      description: |-
        **gpt-5 and o-series models only**
        Configuration options for
        [reasoning models](https://platform.openai.com/docs/guides/reasoning).
      title: Reasoning
    OpenAIReasoningEffort:
      description: |-
        Constrains effort on reasoning for
        [reasoning models](https://platform.openai.com/docs/guides/reasoning).
        Currently supported values are `none`, `minimal`, `low`, `medium`, `high`, and `xhigh`. Reducing
        reasoning effort can result in faster responses and fewer tokens used
        on reasoning in a response.
        - `gpt-5.1` defaults to `none`, which does not perform reasoning. The supported reasoning values for `gpt-5.1` are `none`, `low`, `medium`, and `high`. Tool calls are supported for all reasoning values in gpt-5.1.
        - All models before `gpt-5.1` default to `medium` reasoning effort, and do not support `none`.
        - The `gpt-5-pro` model defaults to (and only supports) `high` reasoning effort.
        - `xhigh` is supported for all models after `gpt-5.1-codex-max`.
      type: string
      enum:
      - none
      - minimal
      - low
      - medium
      - high
      - xhigh
      nullable: true
    OpenAIResponseError:
      type: object
      required:
      - code
      - message
      properties:
        code:
          $ref: '#/components/schemas/OpenAIResponseErrorCode'
        message:
          type: string
          description: A human-readable description of the error.
      description: An error object returned when the model fails to generate a Response.
    OpenAIResponseErrorCode:
      type: string
      enum:
      - server_error
      - rate_limit_exceeded
      - invalid_prompt
      - vector_store_timeout
      - invalid_image
      - invalid_image_format
      - invalid_base64_image
      - invalid_image_url
      - image_too_large
      - image_too_small
      - image_parse_error
      - image_content_policy_violation
      - invalid_image_mode
      - image_file_too_large
      - unsupported_image_media_type
      - empty_image_file
      - failed_to_download_image
      - image_file_not_found
      description: The error code for the response.
    OpenAIResponseIncompleteDetails:
      type: object
      properties:
        reason:
          type: string
          enum:
          - max_output_tokens
          - content_filter
    OpenAIResponsePromptVariables:
      type: object
      description: |-
        Optional map of values to substitute in for variables in your
        prompt. The substitution values can either be strings, or other
        Response input types like images or files.
      title: Prompt Variables
      x-oaiExpandable: true
      x-oaiTypeLabel: map
    OpenAIResponseStreamOptions:
      type: object
      properties:
        include_obfuscation:
          type: boolean
          description: |-
            When true, stream obfuscation will be enabled. Stream obfuscation adds
              random characters to an `obfuscation` field on streaming delta events to
              normalize payload sizes as a mitigation to certain side-channel attacks.
              These obfuscation fields are included by default, but add a small amount
              of overhead to the data stream. You can set `include_obfuscation` to
              false to optimize for bandwidth if you trust the network links between
              your application and the OpenAI API.
      description: 'Options for streaming responses. Only set this when you set `stream: true`.'
    OpenAIResponseTextParam:
      type: object
      properties:
        format:
          $ref: '#/components/schemas/OpenAITextResponseFormatConfiguration'
        verbosity:
          $ref: '#/components/schemas/OpenAIVerbosity'
      description: |-
        Configuration options for a text response from the model. Can be plain
        text or structured JSON data. Learn more:
        - [Text inputs and outputs](/docs/guides/text)
        - [Structured Outputs](/docs/guides/structured-outputs)
    OpenAIResponseUsage:
      type: object
      required:
      - input_tokens
      - input_tokens_details
      - output_tokens
      - output_tokens_details
      - total_tokens
      properties:
        input_tokens:
          type: integer
          description: The number of input tokens.
        input_tokens_details:
          allOf:
          - $ref: '#/components/schemas/OpenAIResponseUsageInputTokensDetails'
          description: A detailed breakdown of the input tokens.
        output_tokens:
          type: integer
          description: The number of output tokens.
        output_tokens_details:
          allOf:
          - $ref: '#/components/schemas/OpenAIResponseUsageOutputTokensDetails'
          description: A detailed breakdown of the output tokens.
        total_tokens:
          type: integer
          description: The total number of tokens used.
      description: |-
        Represents token usage details including input tokens, output tokens,
        a breakdown of output tokens, and the total tokens used.
    OpenAIResponseUsageInputTokensDetails:
      type: object
      required:
      - cached_tokens
      properties:
        cached_tokens:
          type: integer
    OpenAIResponseUsageOutputTokensDetails:
      type: object
      required:
      - reasoning_tokens
      properties:
        reasoning_tokens:
          type: integer
    OpenAITextResponseFormatConfiguration:
      type: object
      required:
      - type
      properties:
        type:
          $ref: '#/components/schemas/OpenAITextResponseFormatConfigurationType'
      discriminator:
        propertyName: type
        mapping:
          json_schema: '#/components/schemas/OpenAI.TextResponseFormatJsonSchema'
          text: '#/components/schemas/OpenAI.TextResponseFormatConfigurationResponseFormatText'
          json_object: '#/components/schemas/OpenAI.TextResponseFormatConfigurationResponseFormatJsonObject'
      description: |-
        An object specifying the format that the model must output.
        Configuring `{ "type": "json_schema" }` enables Structured Outputs,
        which ensures the model will match your supplied JSON schema. Learn more in the
        [Structured Outputs guide](/docs/guides/structured-outputs).
        The default format is `{ "type": "text" }` with no additional options.
        *Not recommended for gpt-4o and newer models:**
        Setting to `{ "type": "json_object" }` enables the older JSON mode, which
        ensures the message the model generates is valid JSON. Using `json_schema`
        is preferred for models that support it.
    OpenAITextResponseFormatConfigurationType:
      anyOf:
      - type: string
      - type: string
        enum:
        - text
        - json_schema
        - json_object
    OpenAITool:
      type: object
      required:
      - type
      properties:
        type:
          $ref: '#/components/schemas/OpenAIToolType'
      discriminator:
        propertyName: type
        mapping:
          code_interpreter: '#/components/schemas/OpenAI.CodeInterpreterTool'
          function: '#/components/schemas/OpenAI.FunctionTool'
          file_search: '#/components/schemas/OpenAI.FileSearchTool'
          computer_use_preview: '#/components/schemas/OpenAI.ComputerUsePreviewTool'
          web_search: '#/components/schemas/OpenAI.WebSearchTool'
          mcp: '#/components/schemas/OpenAI.MCPTool'
          image_generation: '#/components/schemas/OpenAI.ImageGenTool'
          local_shell: '#/components/schemas/OpenAI.LocalShellToolParam'
          shell: '#/components/schemas/OpenAI.FunctionShellToolParam'
          custom: '#/components/schemas/OpenAI.CustomToolParam'
          web_search_preview: '#/components/schemas/OpenAI.WebSearchPreviewTool'
          apply_patch: '#/components/schemas/OpenAI.ApplyPatchToolParam'
          computer: '#/components/schemas/OpenAI.ComputerTool'
          namespace: '#/components/schemas/OpenAI.NamespaceToolParam'
          tool_search: '#/components/schemas/OpenAI.ToolSearchToolParam'
      description: A tool that can be used to generate a response.
    OpenAIToolChoiceOptions:
      type: string
      enum:
      - none
      - auto
      - required
      description: |-
        Controls which (if any) tool is called by the model.
        `none` means the model will not call any tool and instead generates a message.
        `auto` means the model can pick between generating a message or calling one or
        more tools.
        `required` means the model must call one or more tools.
      title: Tool choice mode
    OpenAIToolChoiceParam:
      type: object
      required:
      - type
      properties:
        type:
          $ref: '#/components/schemas/OpenAIToolChoiceParamType'
      discriminator:
        propertyName: type
        mapping:
          allowed_tools: '#/components/schemas/OpenAI.ToolChoiceAllowed'
          mcp: '#/components/schemas/OpenAI.ToolChoiceMCP'
          custom: '#/components/schemas/OpenAI.ToolChoiceCustom'
          apply_patch: '#/components/schemas/OpenAI.SpecificApplyPatchParam'
          shell: '#/components/schemas/OpenAI.SpecificFunctionShellParam'
          file_search: '#/components/schemas/OpenAI.ToolChoiceFileSearch'
          web_search_preview: '#/components/schemas/OpenAI.ToolChoiceWebSearchPreview'
          computer_use_preview: '#/components/schemas/OpenAI.ToolChoiceComputerUsePreview'
          web_search_preview_2025_03_11: '#/components/schemas/OpenAI.ToolChoiceWebSearchPreview20250311'
          image_generation: '#/components/schemas/OpenAI.ToolChoiceImageGeneration'
          code_interpreter: '#/components/schemas/OpenAI.ToolChoiceCodeInterpreter'
          computer: '#/components/schemas/OpenAI.ToolChoiceComputer'
          computer_use: '#/components/schemas/OpenAI.ToolChoiceComputerUse'
          function: '#/components/schemas/OpenAI.ToolChoiceFunction'
      description: |-
        How the model should select which tool (or tools) to use when generating
        a response. See the `tools` parameter to see how to specify which tools
        the model can call.
    OpenAIToolChoiceParamType:
      anyOf:
      - type: string
      - type: string
        enum:
        - allowed_tools
        - function
        - mcp
        - custom
        - apply_patch
        - shell
        - file_search
        - web_search_preview
        - computer_use_preview
        - web_search_preview_2025_03_11
        - image_generation
        - code_interpreter
        - computer
        - computer_use
    OpenAIToolType:
      anyOf:
      - type: string
      - type: string
        enum:
        - function
        - file_search
        - computer
        - computer_use_preview
        - web_search
        - mcp
        - code_interpreter
        - image_generation
        - local_shell
        - shell
        - custom
        - namespace
        - tool_search
        - web_search_preview
        - apply_patch
    OpenAIToolsArray:
      type: array
      items:
        $ref: '#/components/schemas/OpenAITool'
      description: |-
        An array of tools the model may call while generating a response. You
        can specify which tool to use by setting the `tool_choice` parameter.
        We support the following categories of tools:
        - **Built-in tools**: Tools that are provided by OpenAI that extend the
        model's capabilities, like [web search](/docs/guides/tools-web-search)
        or [file search](/docs/guides/tools-file-search). Learn more about
        [built-in tools](/docs/guides/tools).
        - **MCP Tools**: Integrations with third-party systems via custom MCP servers
        or predefined connectors such as Google Drive and SharePoint. Learn more about
        [MCP Tools](/docs/guides/tools-connectors-mcp).
        - **Function calls (custom tools)**: Functions that are defined by you,
        enabling the model to call your own code with strongly typed arguments
        and outputs. Learn more about
        [function calling](/docs/guides/function-calling). You can also use
        custom tools to call your own code.
    OpenAIVerbosity:
      description: |-
        Constrains the verbosity of the model's response. Lower values will result in
        more concise responses, while higher values will result in more verbose responses.
        Currently supported values are `low`, `medium`, and `high`.
      type: string
      enum:
      - low
      - medium
      - high
      nullable: true
    InlineResponse200:
      type: object
      required:
      - id
      - object
      - created_at
      - error
      - incomplete_details
      - output
      - instructions
      - parallel_tool_calls
      properties:
        metadata:
          $ref: '#/components/schemas/OpenAIMetadata'
          nullable: true
        top_logprobs:
          type: integer
          nullable: true
        temperature:
          default: 1
          type: number
          nullable: true
        top_p:
          default: 1
          type: number
          nullable: true
        user:
          type: string
          description: |-
            This field is being replaced by `safety_identifier` and `prompt_cache_key`. Use `prompt_cache_key` instead to maintain caching optimizations.
              A stable identifier for your end-users.
              Used to boost cache hit rates by better bucketing similar requests and  to help OpenAI detect and prevent abuse. [Learn more](/docs/guides/safety-best-practices#safety-identifiers).
          deprecated: true
        safety_identifier:
          type: string
          maxLength: 64
          description: |-
            A stable identifier used to help detect users of your application that may be violating OpenAI's usage policies.
              The IDs should be a string that uniquely identifies each user, with a maximum length of 64 characters. We recommend hashing their username or email address, in order to avoid sending us any identifying information. [Learn more](/docs/guides/safety-best-practices#safety-identifiers).
        prompt_cache_key:
          type: string
          description: Used by OpenAI to cache responses for similar requests to optimize your cache hit rates. Replaces the `user` field. [Learn more](/docs/guides/prompt-caching).
        prompt_cache_retention:
          type: string
          enum:
          - in_memory
          - 24h
          nullable: true
        previous_response_id:
          type: string
          nullable: true
        model:
          type: string
          description: |-
            Model ID used to generate the response, like `gpt-4o` or `o3`. OpenAI
              offers a wide range of models with different capabilities, performance
              characteristics, and price points. Refer to the [model guide](/docs/models)
              to browse and compare available models.
        reasoning:
          $ref: '#/components/schemas/OpenAIReasoning'
          nullable: true
        background:
          type: boolean
          nullable: true
        max_tool_calls:
          type: integer
          nullable: true
        text:
          $ref: '#/components/schemas/OpenAIResponseTextParam'
        tools:
          $ref: '#/components/schemas/OpenAIToolsArray'
        tool_choice:
          oneOf:
          - $ref: '#/components/schemas/OpenAIToolChoiceOptions'
          - $ref: '#/components/schemas/OpenAIToolChoiceParam'
        prompt:
          $ref: '#/components/schemas/OpenAIPrompt'
        truncation:
          default: disabled
          type: string
          enum:
          - auto
          - disabled
          nullable: true
        id:
          type: string
          description: Unique identifier for this Response.
        object:
          type: string
          enum:
          - response
          description: The object type of this resource - always set to `response`.
          x-stainless-const: true
        status:
          type: string
          enum:
          - completed
          - failed
          - in_progress
          - cancelled
          - queued
          - incomplete
          description: |-
            The status of the response generation. One of `completed`, `failed`,
              `in_progress`, `cancelled`, `queued`, or `incomplete`.
        created_at:
          type: integer
          format: unixtime
          description: Unix timestamp (in seconds) of when this Response was created.
        completed_at:
          type: number
          format: unixtime
          nullable: true
          description: |-
            Unix timestamp (in seconds) of when this Response was completed.
              Only present when the status is `completed`.
        error:
          allOf:
          - $ref: '#/components/schemas/OpenAIResponseError'
          nullable: true
        incomplete_details:
          allOf:
          - $ref: '#/components/schemas/OpenAIResponseIncompleteDetails'
          nullable: true
        output:
          type: array
          items:
            $ref: '#/components/schemas/OpenAIOutputItem'
          description: |-
            An array of content items generated by the model.
              - The length and order of items in the `output` array is dependent
              on the model's response.
              - Rather than accessing the first item in the `output` array and
              assuming it's an `assistant` message with the content generated by
              the model, you might consider using the `output_text` property where
              supported in SDKs.
        instructions:
          anyOf:
          - type: string
          - type: array
            items:
              $ref: '#/components/schemas/OpenAIInputItem'
          nullable: true
        output_text:
          type: string
          nullable: true
          description: |-
            SDK-only convenience property; it is **not** part of the REST payload.
              The official OpenAI SDKs compute it on the client side by concatenating the
              `text` of every `output_text` content part in `output`. The service does not
              send this field, so it is nil on responses returned by this connector.
              Read the generated text from the `output` array instead.
        usage:
          $ref: '#/components/schemas/OpenAIResponseUsage'
        parallel_tool_calls:
          type: boolean
          description: Whether to allow the model to run tool calls in parallel.
          default: true
        conversation:
          $ref: '#/components/schemas/OpenAIConversationReference'
          nullable: true
        max_output_tokens:
          type: integer
          nullable: true
        content_filters:
          type: array
          items:
            $ref: '#/components/schemas/AzureContentFilterForResponsesAPI'
          description: The content filter results from RAI.
    AzureContentFilterBlocklistResultDetails:
      type: object
      properties:
        filtered:
          type: boolean
          description: A value indicating whether the blocklist produced a filtering action.
        id:
          type: string
          description: The ID of the custom blocklist evaluated.
      required:
      - filtered
      - id
    AzureContentFilterCustomTopicResultDetails:
      type: object
      properties:
        detected:
          type: boolean
          description: A value indicating whether the topic is detected.
        id:
          type: string
          description: The ID of the custom topic evaluated.
      required:
      - detected
      - id
    AzureContentFilterResultsForResponsesAPIError:
      type: object
      properties:
        code:
          type: integer
          format: int32
          description: A distinct, machine-readable code associated with the error.
        message:
          type: string
          description: A human-readable message associated with the error.
      required:
      - code
      - message
      description: If present, details about an error that prevented content filtering from completing its evaluation.
    AzureContentFilterResultsForResponsesAPIProtectedMaterialCode:
      type: object
      properties:
        filtered:
          type: boolean
          description: Whether the content detection resulted in a content filtering action.
        detected:
          type: boolean
          description: Whether the labeled content category was detected in the content.
        citation:
          $ref: '#/components/schemas/AzureContentFilterResultsForResponsesAPIProtectedMaterialCodeCitation'
      required:
      - filtered
      - detected
      description: A detection result that describes a match against licensed code or other protected source material.
    AzureContentFilterResultsForResponsesAPIProtectedMaterialCodeCitation:
      type: object
      properties:
        license:
          type: string
          description: The name or identifier of the license associated with the detection.
        URL:
          type: string
          format: uri
          description: The URL associated with the license.
      description: If available, the citation details describing the associated license and its location.
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: api-key
    OAuth2Auth:
      type: oauth2
      flows:
        implicit:
          authorizationUrl: https://login.microsoftonline.com/common/oauth2/v2.0/authorize
          scopes:
            https://cognitiveservices.azure.com/.default: ''
servers:
- url: '{endpoint}/openai/v1'
  description: Azure AI Foundry Models APIs
  variables:
    endpoint:
      default: ''
      description: |-
        A supported Azure AI Foundry Models APIs endpoint, including protocol and hostname.
        For example:
        https://westus.api.cognitive.microsoft.com).
